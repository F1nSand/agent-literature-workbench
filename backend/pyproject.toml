[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "literature-workbench-api"
version = "0.1.0"
description = "FastAPI backend for the literature reading workbench"
requires-python = ">=3.11,<3.14"
dependencies = [
  "alembic==1.16.1",
  "fastapi==0.115.12",
  "jieba==0.42.1",
  "langgraph==1.2.12",
  "langgraph-checkpoint-postgres==3.1.2",
  "pgvector==0.4.1",
  "PyMuPDF==1.28.0",
  "pypdf==6.16.2",
  "psycopg[binary]==3.2.9",
  "python-multipart==0.0.20",
  "pydantic-settings==2.9.1",
  "sqlalchemy==2.0.41",
  "uvicorn[standard]==0.34.2",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==8.4.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
